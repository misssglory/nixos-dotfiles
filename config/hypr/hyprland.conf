# hyprland.conf

autogenerated = 0

$mainMod = SUPER
$terminal = alacritty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, L, togglefloating,
bind = $mainMod, R, exec, $menu


# ─────────────────────────────────────────────
# INPUT / KEYBOARD
# ─────────────────────────────────────────────

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,ctrl:swapcaps
}


# ─────────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────────

general {
    border_size = 1
    gaps_in = 2
    gaps_out = 2
}

decoration {
    rounding = 5
    rounding_power = 2.0
}


# ─────────────────────────────────────────────
# TOUCHPAD
# ─────────────────────────────────────────────

input {
    sensitivity = 0.5

    touchpad {
        tap-to-click = true
        natural_scroll = false
        drag_lock = true
    }
}


# ─────────────────────────────────────────────
# WORKSPACES: SUPER + 1..9
# ─────────────────────────────────────────────

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9


# ─────────────────────────────────────────────
# MOVE WINDOW: SUPER + SHIFT + 1..9
# ─────────────────────────────────────────────

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9


# ─────────────────────────────────────────────
# MOUSE / TOUCHPAD WINDOW MOVE + RESIZE
# ─────────────────────────────────────────────

# SUPER + left mouse button = move
bindm = $mainMod, mouse:272, movewindow

# SUPER + right mouse button = resize
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, right, movecurrentworkspacetomonitor, r

# ─────────────────────────────────────────────
# TOUCHPAD GESTURES
# ─────────────────────────────────────────────

# Three-finger horizontal swipe -> previous/next workspace
gesture = 3, horizontal, workspace


# ─────────────────────────────────────────────
# CLIPBOARD HISTORY
# ─────────────────────────────────────────────

# Store text clipboard entries
exec-once = wl-paste --type text --watch cliphist store

# Store images too
exec-once = wl-paste --type image --watch cliphist store

# SUPER + V → clipboard history
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy


# ─────────────────────────────────────────────
# APP LAUNCHER
# ─────────────────────────────────────────────

# SUPER + S → fuzzel
bind = $mainMod, S, exec, fuzzel


# ─────────────────────────────────────────────
# SCREENSHOT + OCR
# ─────────────────────────────────────────────

# SUPER + SHIFT + S
#
# Select region with slurp
# Capture with grim
# Save image to disk
# Copy PNG to clipboard
# Run OCR asynchronously
# Show Lines / Words / Characters notification
bind = $mainMod SHIFT, P, exec, screenshot-ocr


# ─────────────────────────────────────────────
# MONITOR
# ─────────────────────────────────────────────

monitor = eDP-1, preferred, auto, 1.25


# ─────────────────────────────────────────────
# NOTIFICATIONS
# ─────────────────────────────────────────────

# Close current notification
bind = $mainMod, W, exec, makoctl dismiss

# Close all notifications
bind = $mainMod SHIFT, W, exec, makoctl dismiss -a


# ─────────────────────────────────────────────
# MONOCLE / STACKED WINDOWS
# ─────────────────────────────────────────────

# SUPER + M → stack all tiled windows
bind = $mainMod, M, exec, hyprctl keyword general:layout monocle

# SUPER + T → normal tiling
bind = $mainMod, T, exec, hyprctl keyword general:layout dwindle

# SUPER + Right → next window
bind = $mainMod, Right, cyclenext, tiled

# SUPER + Left → previous window
bind = $mainMod, Left, cyclenext, prev tiled

# ─────────────────────────────────────────────
# SYSTEMD / WAYLAND ENVIRONMENT
# ─────────────────────────────────────────────

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user restart waybar.service
